<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
header{background:linear-gradient(135deg,#0B5CA3,#0A4D8F);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:14px}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.5px}
header .sub{margin-top:6px;font-size:12.5px;opacity:.92}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 14px}
.stat b{font-size:17px;display:block;line-height:1.1}
.stat span{font-size:11px;opacity:.85}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.toolbar input[type=text]{flex:1 1 200px;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.btn{padding:9px 14px;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;color:#fff;background:var(--primary);transition:background .15s}
.btn:hover{background:var(--primary-2)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{background:var(--chip)}
.btn.up{border:1px dashed var(--primary);background:#EFF4FB;color:var(--primary)}
.btn.up:hover{background:#DCE7F4}
#cfgFile{display:none}
.srcinfo{background:var(--chip);border:1px solid var(--line);padding:8px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#33506B}
.hint{background:#EFF4FB;border-left:3px solid var(--primary);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:12px;color:#33506B}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tablewrap{overflow:auto;max-height:72vh}
table{width:100%;border-collapse:collapse;table-layout:fixed;white-space:nowrap}
thead th{position:sticky;top:0;z-index:2;background:#E6EEF6;color:#16324C;font-weight:600;font-size:13px;padding:11px 10px;text-align:left;border-bottom:2px solid var(--primary);user-select:none}
thead th[data-k]{cursor:pointer}
thead th[data-k]:hover{background:#DCE7F4}
thead th .arw{font-size:10px;color:var(--muted);margin-left:4px}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle;font-size:13px;overflow:hidden;text-overflow:ellipsis}
tbody tr:hover{background:#F6FAFD}
td.num{text-align:right;color:var(--muted);width:52px}
td.ip{font-family:"Consolas","Menlo",monospace;font-size:12.5px}
td.desc{white-space:normal;word-break:break-all;line-height:1.45}
.mac-cell{width:210px}
.mac-cell input{width:100%;padding:6px 8px;border:1px solid var(--mac-line);border-radius:6px;background:var(--mac);font-family:"Consolas","Menlo",monospace;font-size:12.5px;color:var(--ink)}
.mac-cell input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
.mac-cell input::placeholder{color:#B9A85F}
colgroup col.c1{width:52px}
colgroup col.c2{width:120px}
colgroup col.c3{width:220px}
colgroup col.c4{width:200px}
colgroup col.c5{width:70px}
colgroup col.c6{width:130px}
colgroup col.c7{width:130px}
colgroup col.c8{width:210px}
footer{margin-top:14px;color:var(--muted);font-size:12.5px;line-height:1.7}
#empty{display:none;padding:40px;text-align:center;color:var(--muted)}
@media (max-width:720px){header{padding:14px;border-radius:10px}header h1{font-size:17px}.toolbar input[type=text]{min-width:100%}.btn{flex:1 1 auto}}
</style>
</head>

</div>

type": "汇川 MD580", "fw": "", "ip": "172.16.20.148", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "137"}, {"name": "C31506-2", "desc": "施胶损纸池 2#搅拌器", "type": "汇川 MD580", "fw": "", "ip": "172.16.20.149", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "138"}, {"name": "P31507", "desc": "施胶损纸浆泵", "type": "汇川 MD580", "fw": "", "ip": "172.16.20.150", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "139"}, {"name": "C31510-1", "desc": "卷取损纸池 1#搅拌器", "type": "汇川 MD580", "fw": "", "ip": "172.16.20.151", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "140"}, {"name": "C31510-2", "desc": "卷取损纸池 2#搅拌器", "type": "汇川 MD580", "fw": "", "ip": "172.16.20.152", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "141"}, {"name": "P31511", "desc": "卷取损纸浆泵", "type": "汇川 MD580", "fw": "", "ip": "172.16.20.153", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "142"}, {"name": "M31951", "desc": "13#排水泵B", "type": "汇川 MD500PN2", "fw": "", "ip": "172.16.20.154", "mask": "255.255.255.0", "subsys": "ZZ_FildBus", "devno": "143"}];
const LS_PREFIX = "pn_mac_";
let state = {query:"", type:"", key:"name", dir:1};
let currentSource = "simatic 400(zz).cfg（内嵌默认数据）";

/* ============ cfg 解析器（浏览器内直接解析任意 .cfg）============ */
const BRAND={inovance:'汇川',siemens:'西门子',schneider:'施耐德',abb:'ABB',danfoss:'丹佛斯',lenze:'伦茨',wago:'万可',beckhoff:'倍福',turck:'图尔克',ifm:'易福门','pepperl-fuchs':'倍加福',sanyo:'三洋',panasonic:'松下',mitsubishi:'三菱',omron:'欧姆龙',yaskawa:'安川',rockwell:'罗克韦尔',bosch:'博世',fanuc:'发那科',festo:'费斯托',parker:'派克',moeller:'穆勒',phoenix:'菲尼克斯',profinet:'PROFINET'};
const GSDML_RE=/^GSDML-[^-]+-([^-]+)-([^-]+)-/i;

function devtype(prod){
  if(String(prod).startsWith('S2:6DL1')) return '西门子 6DL1 155-6AU00-0PM0 (ET200pro)';
  const m=GSDML_RE.exec(prod);
  if(m){ const vendor=m[1].toLowerCase(), device=m[2]; return (BRAND[vendor]||vendor)+' '+device; }
  return String(prod);
}
function hex2ip(h){
  h=String(h||''); if(h.length<8) return '';
  h=h.padStart(8,'0');
  return [0,2,4,6].map(a=>parseInt(h.substr(a,2),16)).join('.');
}
function parseCfg(text){
  const lines=text.split(/\r?\n/);
  const devRe=/^IOSUBSYSTEM\s+(\d+),\s*IOADDRESS\s+(\d+),\s*"([^"]*)"(?:\s+"([^"]*)")?\s*,\s*"([^"]*)"\s*$/;
  const slotRe=/^IOSUBSYSTEM\s+(\d+),\s*IOADDRESS\s+(\d+),\s*SLOT\s+(\d+),\s*"([^"]*)",\s*"([^"]*)"\s*$/;
  const macRe=/MACADDRESS\s+"([0-9A-Fa-f]+)"/;
  const ipRe=/IPADDRESS\s+"([0-9A-Fa-f]+)"/;
  const maskRe=/SUBNETMASK\s+"([0-9A-Fa-f]+)"/;
  const subMap={100:'SystemBus',101:'ZZ_FildBus'};
  const devs=[];
  lines.forEach(line=>{
    const m=devRe.exec(line.trim());
    if(m){ devs.push({subsys:m[1],ioaddr:m[2],prod:m[3],fw:m[4]||'',name:m[5],comment:'',mac:'',ip:'',mask:''}); }
  });
  const map={}; devs.forEach(d=>map[d.subsys+'|'+d.ioaddr+'|'+d.name]=d);
  for(let i=0;i<lines.length;i++){
    const m=devRe.exec(lines[i].trim());
    if(!m) continue;
    const d=map[m[1]+'|'+m[2]+'|'+m[5]]; if(!d) continue;
    for(let j=i+1;j<lines.length;j++){
      const t=lines[j].trim();
      if(t==='END') break;
      if(t.indexOf('COMMENT')===0){
        const cm=/COMMENT\s+"(.*)"\s*$/.exec(t);
        if(cm) d.comment=cm[1];
      }
    }
  }
  for(let i=0;i<lines.length;i++){
    const m=slotRe.exec(lines[i].trim());
    if(!m) continue;
    const d=map[m[1]+'|'+m[2]+'|'+m[5]]; if(!d || d.mac) continue;
    let j=i+1, blk='';
    for(;j<lines.length;j++){ const t=lines[j].trim(); if(t==='END') break; blk+=t+'\n'; }
    const mm=macRe.exec(blk); if(!mm) continue;
    d.mac=mm[1];
    const ip=ipRe.exec(blk); if(ip) d.ip=ip[1];
    const mk=maskRe.exec(blk); if(mk) d.mask=mk[1];
  }
  devs.sort((a,b)=> a.subsys===b.subsys ? (parseInt(a.ioaddr)-parseInt(b.ioaddr)) : a.subsys.localeCompare(b.subsys));
  return devs.map(d=>({name:d.name,desc:(d.comment||'—'),type:devtype(d.prod),fw:d.fw,ip:hex2ip(d.ip),mask:hex2ip(d.mask),subsys:(subMap[d.subsys]||d.subsys),devno:d.ioaddr}));
}

/* ============ 渲染 ============ */
function macVal(name){ return localStorage.getItem(LS_PREFIX+name) || ""; }
function ipnum(ip){ return ip.split(".").reduce((a,x,i)=>a+(parseInt(x,10)||0)*Math.pow(256,3-i),0); }
function netOf(ip,mask){ const a=ip.split(".").map(Number), b=mask.split(".").map(Number); return a.map((x,i)=>x&b[i]).join("."); }
function prefixOf(mask){ return mask.split(".").reduce((n,o)=>n+(parseInt(o,10).toString(2).match(/1/g)||[]).length,0); }

function renderStats(){
  const total=RAW_DATA.length, by={}, filled={mac:0};
  RAW_DATA.forEach(d=>{ by[d.type]=(by[d.type]||0)+1; if(macVal(d.name)) filled.mac++; });
  const el=document.getElementById("stats");
  el.innerHTML=`<div class="stat"><b>${total}</b><span>设备总数</span></div>`+
               `<div class="stat"><b>${filled.mac}</b><span>已填 MAC</span></div>`;
  Object.keys(by).sort((a,b)=>a.localeCompare(b)).forEach(t=>{
    const div=document.createElement("div"); div.className="stat";
    div.innerHTML=`<b>${by[t]}</b><span>${t}</span>`; el.appendChild(div);
  });
  // 副标题完全由数据动态推导
  const subsys=[...new Set(RAW_DATA.map(d=>d.subsys||"未知"))].join(" / ");
  const nets=[...new Set(RAW_DATA.map(d=>(d.ip&&d.mask)?netOf(d.ip,d.mask):null))].filter(Boolean);
  let netTxt="—";
  if(nets.length){
    netTxt=nets.map(n=>{ const mk=RAW_DATA.find(d=>d.ip&&d.mask&&netOf(d.ip,d.mask)===n); return `${n}/${prefixOf(mk.mask)}`; }).join("、");
  }
  document.getElementById("subtitle").textContent=
    `子系统：${subsys}　网段：${netTxt}　来源：${currentSource}`;
  document.getElementById("foot").textContent=
    "提示：组态中 MAC 均为占位值 08-00-06-01-00-00（非设备真实 MAC），请现场按设备铭牌填写到 MAC 列。填写内容仅保存在本机浏览器，清除浏览器数据会丢失，建议导出 CSV 备份。";
}

function render(){
  renderStats();
  const q=state.query.toLowerCase();
  let rows=RAW_DATA.filter(d=>{
    const okQ=!q || d.name.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.ip.includes(q);
    const okT=!state.type || d.type===state.type;
    return okQ && okT;
  });
  const k=state.key, dir=state.dir;
  if(k==="devno") rows.sort((a,b)=>(parseInt(a.devno,10)-parseInt(b.devno,10))*dir);
  else if(k==="name") rows.sort((a,b)=>a.name.localeCompare(b.name)*dir);
  else if(k==="type") rows.sort((a,b)=>a.type.localeCompare(b.type)*dir);
  else if(k==="desc") rows.sort((a,b)=>a.desc.localeCompare(b.desc)*dir);
  else if(k==="fw") rows.sort((a,b)=>(a.fw||"").localeCompare(b.fw||"")*dir);
  else if(k==="ip") rows.sort((a,b)=>(ipnum(a.ip)-ipnum(b.ip))*dir);
  else if(k==="mask") rows.sort((a,b)=>(ipnum(a.mask)-ipnum(b.mask))*dir);
  const tb=document.getElementById("tbody");
  tb.innerHTML=rows.map((d,i)=>{
    return `<tr>
      <td class="num">${d.devno}</td>
      <td title="${d.name}"><b>${d.name}</b></td>
      <td class="desc" title="${d.desc}">${d.desc}</td>
      <td>${d.type}</td>
      <td>${d.fw||"—"}</td>
      <td class="ip">${d.ip}</td>
      <td class="ip">${d.mask}</td>
      <td class="mac-cell"><input type="text" data-name="${d.name}" value="${macVal(d.name)}" placeholder="08-00-06-01-00-00 占位" spellcheck="false"></td>
    </tr>`;
  }).join("");
  document.getElementById("empty").style.display=rows.length?"none":"block";
}

function initTypeFilter(){
  const sel=document.getElementById("typeFilter");
  sel.innerHTML='<option value="">全部设备类型</option>';
  [...new Set(RAW_DATA.map(d=>d.type))].sort((a,b)=>a.localeCompare(b)).forEach(t=>{
    const o=document.createElement("option"); o.value=t; o.textContent=t; sel.appendChild(o);
  });
}

/* ============ 交互 ============ */
document.getElementById("tbody").addEventListener("input", e=>{
  const t=e.target; if(!t || !t.hasAttribute("data-name")) return;
  const isSn=t.dataset.field==="sn";
  localStorage.setItem(isSn ? LS_PREFIX+"sn_"+t.dataset.name : LS_PREFIX+t.dataset.name,
                        isSn ? t.value : t.value.toUpperCase());
});
document.getElementById("search").addEventListener("input", e=>{ state.query=e.target.value; render(); });
document.getElementById("typeFilter").addEventListener("change", e=>{ state.type=e.target.value; render(); });
document.querySelectorAll("thead th[data-k]").forEach(th=>{
  th.addEventListener("click", ()=>{
    const k=th.dataset.k;
    if(state.key===k) state.dir=-state.dir; else { state.key=k; state.dir=1; }
    document.querySelectorAll("thead th[data-k] .arw").forEach(a=>a.textContent="");
    const a=th.querySelector(".arw"); if(a) a.textContent=state.dir>0?"▲":"▼";
    render();
  });
});
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(confirm("确定清空所有已填写的 MAC 地址？此操作不可恢复。")){
    RAW_DATA.forEach(d=>localStorage.removeItem(LS_PREFIX+d.name)); render();
  }
});
document.getElementById("exportBtn").addEventListener("click", ()=>{
  const head=["设备编号","设备名称","设备描述","设备类型","固件版本","IP地址","子网掩码","MAC地址"];
  const esc=v=>{ v=String(v==null?"":v); return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const lines=[head.map(esc).join(",")];
  RAW_DATA.forEach(d=>lines.push([d.devno,d.name,d.desc,d.type,d.fw||"",d.ip,d.mask,macVal(d.name)].map(esc).join(",")));
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="PN设备MAC分配表_已填.csv"; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
});
document.getElementById("cfgFile").addEventListener("change", async e=>{
  const f=e.target.files[0]; if(!f) return;
  const buf=await f.arrayBuffer();
  let text;
  try{ text=new TextDecoder("gbk").decode(buf); }
  catch(err){ text=new TextDecoder("utf-8").decode(buf); }
  const data=parseCfg(text);
  if(!data.length){ alert("未解析到 PROFINET IO 设备，请确认是 STEP7 组态(.cfg) 文件。"); return; }
  RAW_DATA.length=0; RAW_DATA.push(...data);
  currentSource=f.name;
  state={query:"",type:"",key:"name",dir:1};
  document.getElementById("search").value="";
  document.querySelectorAll("thead th[data-k] .arw").forEach(a=>a.textContent="");
  initTypeFilter(); render();
  document.getElementById("srcinfo").textContent="已导入： "+f.name+"　设备 "+data.length+" 台。在下方填写 MAC，导出 CSV 保存。";
  e.target.value="";
});

initTypeFilter();
render();
</script>
